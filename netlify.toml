# Netlify configuration for the Velacore Health static site.
# Publishes public/ with clean URLs, no trailing slash and the security headers below. It began as a mirror of
# vercel.json, which was removed Nov 20 2026 when the old Vercel project was deleted.
# Drafted Nov 6 2026 for the host move; live on the velacore-health Netlify project since Nov 8 2026.

[build]
  publish = "public"
  command = ""

# Clean URLs: /terms serves public/terms.html; /programs/tirzepatide serves public/programs/tirzepatide.html.
# Netlify's pretty URLs setting does this when enabled in the project's Build & deploy settings;
# these rules make it explicit so the site behaves the same with that setting off.
# velacore.health is a second door: every visit there goes to the one main address, so Google sees one site.
# Added Nov 13 2026 with the domain move. The bare velacorehealth.com to www forward is set in Netlify's
# Domain management as the primary domain, not here, so the two can never loop.
[[redirects]]
  from = "https://velacore.health/*"
  to = "https://www.velacorehealth.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://velacore.health/*"
  to = "https://www.velacorehealth.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.velacore.health/*"
  to = "https://www.velacorehealth.com/:splat"
  status = 301
  force = true

# Nov 20 2026: the project's own Netlify address showed a full second copy of the site. It now forwards every
# visit to the one main address, page for page, so search engines and shared links only ever meet one site.
# Deploy previews use other addresses and are not touched by this rule.
[[redirects]]
  from = "https://velacore-health.netlify.app/*"
  to = "https://www.velacorehealth.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://velacore-health.netlify.app/*"
  to = "https://www.velacorehealth.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/programs/:slug"
  to = "/programs/:slug.html"
  status = 200

[[redirects]]
  from = "/learn/:slug"
  to = "/learn/:slug.html"
  status = 200

[[redirects]]
  from = "/start/:slug"
  to = "/start/:slug.html"
  status = 200

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nov 19 2026: the site uses no location, camera or microphone, and intake runs on the partner's site, so all three are off.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # A narrow policy that blocks plugins, foreign base tags, foreign framing and form posts elsewhere, and loads any
    # http resource on the page over https. It does not restrict scripts, styles or fonts, so Google Analytics and
    # Google Fonts keep working. If OpenLoop ever offers an embedded intake or checkout instead of a link,
    # frame-ancestors, form-action and payment=() must change first.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"
