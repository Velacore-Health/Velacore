# Netlify configuration for the Velacore Health static site.
# Mirrors vercel.json: publish public/, clean URLs, no trailing slash, same security headers.
# Drafted Nov 6 2026 for the host move; not yet used by any Netlify project.

[build]
  publish = "public"
  command = ""

# Clean URLs: /terms serves public/terms.html; /programs/tirzepatide serves public/programs/tirzepatide.html.
# Netlify's pretty URLs setting does this when enabled in the project's Build & deploy settings;
# these rules make it explicit so the site behaves the same with that setting off.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/programs/:slug"
  to = "/programs/:slug.html"
  status = 200

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(self)"
